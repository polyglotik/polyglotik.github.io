<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglotik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-container">
        <!-- SVG Векторный слой (Карта + Волны) -->
        <svg class="header-bg-svg" viewBox="0 0 1440 380" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Паттерн точек карты мира -->
                <pattern id="world-map-dots" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
                    <circle cx="3" cy="3" r="1.5" fill="#ffffff" opacity="0.25"/>
                </pattern>

                <!-- Градиенты волн -->
                <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
                </linearGradient>

                <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#1e5bb8" stop-opacity="0.4" />
                    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
                </linearGradient>

                <linearGradient id="glow-grad" x1="50%" y1="100%" x2="50%" y2="0%">
                    <stop offset="0%" stop-color="#ffdf9e" stop-opacity="0.35" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- Эффект свечения -->
            <ellipse cx="720" cy="320" rx="400" ry="120" fill="url(#glow-grad)" />

            <!-- Точечные контуры материков -->
            <g opacity="0.35">
                <path d="M 150 70 Q 250 50 320 90 T 280 180 T 180 160 Z" fill="url(#world-map-dots)" />
                <path d="M 290 190 Q 340 220 310 280 T 260 250 Z" fill="url(#world-map-dots)" />
                <path d="M 650 60 Q 850 40 1150 80 T 1200 200 T 900 180 T 700 120 Z" fill="url(#world-map-dots)" />
                <path d="M 680 140 Q 780 150 760 250 T 690 240 Z" fill="url(#world-map-dots)" />
                <path d="M 1050 220 Q 1150 210 1160 270 T 1060 270 Z" fill="url(#world-map-dots)" />
            </g>

            <!-- Сеть соединительных линий -->
            <g stroke="#ffffff" stroke-width="0.75" opacity="0.25" stroke-dasharray="3,3">
                <line x1="200" y1="100" x2="700" y2="150" />
                <line x1="700" y1="150" x2="1100" y2="100" />
                <line x1="700" y1="150" x2="720" y2="230" />
                <circle cx="200" cy="100" r="3" fill="#ffffff" />
                <circle cx="700" cy="150" r="4" fill="#ffffff" />
                <circle cx="1100" cy="100" r="3" fill="#ffffff" />
                <circle cx="720" cy="230" r="3" fill="#ffffff" />
            </g>

            <!-- Волны -->
            <path d="M0,300 C320,260 520,360 880,310 C1120,270 1320,330 1440,300 L1440,380 L0,380 Z" fill="url(#wave-grad-2)" />
            <path d="M0,320 C280,270 500,350 780,310 C1080,260 1280,340 1440,310 L1440,380 L0,380 Z" fill="url(#wave-grad-1)" />
            <path d="M0,310 C300,265 480,345 760,305 C1060,255 1260,335 1440,305" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
            <path d="M0,340 C360,290 600,390 960,330 C1200,290 1360,340 1440,330 L1440,380 L0,380 Z" fill="#f4f7f6" />
        </svg>

        <!-- Шапка навигации -->
        <div class="nav-bar">
            <a href="#" class="logo">
                Polyglotik<span>.</span>
            </a>

            <button class="burger-btn" aria-label="Открыть меню языков">
                <div class="burger-line"></div>
                <div class="burger-line"></div>
                <div class="burger-line"></div>
            </button>
        </div>

        <div class="hero-content">
            <div class="hero-title">Изучение иностранных языков с нуля</div>
            <div class="hero-subtitle">Платформа для эффективного старта</div>
        </div>
    </header>

</body>
</html>
