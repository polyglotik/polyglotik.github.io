<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polyglotik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header-container">
        <!-- SVG Vector Layer (Map + Waves) -->
        <svg class="header-bg-svg" viewBox="0 0 1440 160" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- World Map Pattern Dots -->
                <pattern id="world-map-dots" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
                    <circle cx="2.5" cy="2.5" r="1.2" fill="#ffffff" opacity="0.35"/>
                </pattern>

                <!-- Wave Gradients -->
                <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
                </linearGradient>

                <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#064e3b" stop-opacity="0.5" />
                    <stop offset="100%" stop-color="#10b981" stop-opacity="0.25" />
                </linearGradient>

                <linearGradient id="glow-grad" x1="50%" y1="100%" x2="50%" y2="0%">
                    <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.3" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
                </linearGradient>
            </defs>

            <!-- Glow Effect -->
            <ellipse cx="720" cy="140" rx="500" ry="60" fill="url(#glow-grad)" />

            <!-- Pale World Map Dot Continents -->
            <g opacity="0.45">
                <!-- North America -->
                <path d="M 100 20 Q 200 10 270 35 T 230 80 T 130 70 Z" fill="url(#world-map-dots)" />
                <!-- South America -->
                <path d="M 230 85 Q 280 100 250 140 T 210 120 Z" fill="url(#world-map-dots)" />
                <!-- Europe & Asia -->
                <path d="M 600 15 Q 800 5 1180 25 T 1250 90 T 900 80 T 650 40 Z" fill="url(#world-map-dots)" />
                <!-- Africa -->
                <path d="M 640 60 Q 730 65 710 120 T 650 115 Z" fill="url(#world-map-dots)" />
                <!-- Australia -->
                <path d="M 1050 95 Q 1150 90 1160 130 T 1060 130 Z" fill="url(#world-map-dots)" />
            </g>

            <!-- Tech Network Overlay Lines -->
            <g stroke="#ffffff" stroke-width="0.75" opacity="0.2" stroke-dasharray="3,3">
                <line x1="180" y1="40" x2="680" y2="50" />
                <line x1="680" y1="50" x2="1100" y2="30" />
                <line x1="680" y1="50" x2="670" y2="90" />
                <circle cx="180" cy="40" r="2.5" fill="#ffffff" />
                <circle cx="680" cy="50" r="3" fill="#ffffff" />
                <circle cx="1100" cy="30" r="2.5" fill="#ffffff" />
                <circle cx="670" cy="90" r="2.5" fill="#ffffff" />
            </g>

            <!-- Waves -->
            <path d="M0,115 C320,95 520,145 880,120 C1120,100 1320,135 1440,115 L1440,160 L0,160 Z" fill="url(#wave-grad-2)" />
            <path d="M0,125 C280,105 500,140 780,120 C1080,100 1280,135 1440,120 L1440,160 L0,160 Z" fill="url(#wave-grad-1)" />
            <path d="M0,120 C300,100 480,135 760,115 C1060,95 1260,130 1440,115" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />
            <path d="M0,135 C360,110 600,160 960,130 C1200,110 1360,135 1440,130 L1440,160 L0,160 Z" fill="#f4f7f6" />
        </svg>

        <!-- Navigation Bar -->
        <div class="nav-bar">
            <a href="#" class="logo">
                Polyglotik<span>.</span>
            </a>

            <button class="burger-btn" aria-label="Открыть меню языков">
                <div class="burger-line"></div>
                <div class="burger-line"></div>
                <div class="burger-line"></div>
            </button>
        </div>
    </header>

</body>
                  </html>
